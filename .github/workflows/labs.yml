name: Course labs

on:
  push:
    paths:
      - ".github/workflows/labs.yml"
      - "labs/**"
  pull_request:
    paths:
      - ".github/workflows/labs.yml"
      - "labs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab1-datalab:
    name: Lab 1 - DataLab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-check Lab 1
        run: make -C labs/lab1-datalab selftest

  lab2-matrix:
    name: Lab 2 - MatrixLab (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Lab 2
        run: >-
          cmake -S labs/lab2-matrix -B build/lab2
          -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build Lab 2
        run: cmake --build build/lab2 --config Release --parallel 2
      - name: Test Lab 2
        run: ctest --test-dir build/lab2 -C Release --output-on-failure
